<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>ネクスゲート マイページ</title>
<style>
  /* マイページは 2026-11-08 に廃止（ISM 廃止）。案内だけを出す。デザイントークンはシフト・勤怠フォーム（../index.html）と同じ */
  :root {
    --navy: #0f1d3a;
    --bg: #f6f8fc; --bg-glow1: rgba(37, 99, 235, .07); --bg-glow2: rgba(14, 165, 233, .05);
    --surface: #ffffff; --border: #e3e8f1; --text: #0f1d3a; --text2: #55617a;
    --accent: #2563eb; --accent-soft: #e8effe; --accent-text: #ffffff;
    --hero1: #0f1d3a; --hero2: #1d4ed8;
    --shadow: 0 1px 2px rgba(15, 29, 58, .04), 0 6px 20px rgba(15, 29, 58, .06);
    --r-sm: 10px; --r-md: 12px; --radius: 18px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --navy: #e6ecf6;
      --bg: #0b1220; --bg-glow1: rgba(59, 130, 246, .12); --bg-glow2: rgba(14, 165, 233, .06);
      --surface: #121a2b; --border: #24314b; --text: #e6ecf6; --text2: #a3afc4;
      --accent: #60a5fa; --accent-soft: #172a4a; --accent-text: #0b1220;
      --hero1: #13254d; --hero2: #1d4ed8;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .25);
      color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(1100px 520px at 100% -8%, var(--bg-glow1), transparent 62%), radial-gradient(800px 460px at -10% 0%, var(--bg-glow2), transparent 60%), var(--bg);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; line-height: 1.7; }
  header { padding: calc(14px + env(safe-area-inset-top)) 16px 14px; display: flex; align-items: center; gap: 10px; max-width: 760px; margin: 0 auto; }
  .logo { width: 32px; height: 32px; border-radius: var(--r-sm); background: linear-gradient(140deg, var(--hero1), var(--hero2)); }
  header h1 { font-size: 16px; margin: 0; color: var(--navy); }
  main { max-width: 760px; margin: 0 auto; padding: 4px 16px calc(28px + env(safe-area-inset-bottom)); }
  .lead { font-size: 14px; color: var(--text2); margin: 0 0 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { font-size: 16px; margin: 0 0 8px; color: var(--navy); }
  .card p { margin: 0; font-size: 15px; }
  .btn { display: block; text-align: center; margin-top: 14px; padding: 14px; border-radius: var(--r-md); background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 16px; text-decoration: none; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .url { display: block; margin-top: 8px; font-size: 12px; color: var(--text2); word-break: break-all; }
</style>
</head>
<body>
<header><div class="logo" aria-hidden="true"></div><h1>ネクスゲート マイページ</h1></header>
<main>
  <p class="lead">マイページは終了しました。これからは次の2つでお願いします。</p>

  <section class="card">
    <h2>シフトと勤怠はこちら</h2>
    <p>シフト希望の提出と、勤怠（出勤・退勤・休憩）の入力は、このフォームから行ってください。</p>
    <a class="btn" href="https://gotahayashi-max.github.io/shift-form/">シフト・勤怠フォームを開く</a>
    <span class="url">https://gotahayashi-max.github.io/shift-form/</span>
  </section>

  <section class="card">
    <h2>架電数は退勤時に入力</h2>
    <p>退勤するときに、ZoomPhoneのログで自分の架電数を確認し、「テレアポ数値管理（アルバイト）」に入力してください。</p>
  </section>
</main>
</body>
</html>
